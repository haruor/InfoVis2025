<html>
    <head>
        <title>W10: Task 02</title>
    <style>
     body {
         font-family: system-ui;
     }

    /* tooltip 基本（角丸の四角に変更、矢印は削除） */
    #tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 120ms ease, transform 120ms ease;
      background: #222;
      color: #fff;
      border-radius: 8px; /* 角丸 */
      padding: 8px 12px;  /* 少し余裕を増やす */
      font-size: 12px;
      line-height: 1.2;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      z-index: 10000;
      white-space: nowrap;
    }

    /* 表示用クラス（JS はこのクラスを付け外しする） */
    #tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 小見出し */
    #tooltip .tooltip-label {
      display: block;
      font-weight: 700;
      font-size: 11px;
      color: #ddd;
      margin-bottom: 4px;
    }

    /* 矢印を使わないので ::after は削除 */
    </style>
    </head>
    <body>
    <div id="tooltip"></div>
    <svg id="drawing_region" width="256" height="256"></svg>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="w10_task02_main.js"></script>
    </body>
</html>
